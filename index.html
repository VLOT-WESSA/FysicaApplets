<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#eceae4"/>
  <rect x="20" y="22" width="26" height="12" rx="3" fill="#1f9e8f"/>
  <rect x="52" y="22" width="26" height="12" rx="3" fill="#fff" stroke="#d9d3c6"/>
  <rect x="20" y="44" width="26" height="20" rx="3" fill="#fff" stroke="#d9d3c6"/>
  <rect x="52" y="44" width="26" height="20" rx="3" fill="#fff" stroke="#d9d3c6"/>
  <rect x="20" y="70" width="58" height="8" rx="2" fill="#fff" stroke="#d9d3c6"/>
</svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-zwartestraler.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#eceae4}
  button{font-family:inherit}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;color:#2a2723;background:#eceae4;min-height:100vh;padding:28px 28px 48px">
  <div style="max-width:1100px;margin:0 auto">

    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:4px">
      <h1 style="font-size:27px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap">Natuurkunde simulaties</h1>
    </div>
    <p style="margin:0 0 22px;font-size:14px;color:#6f685c;max-width:680px;line-height:1.5">Kies een onderwerp en open een simulatie.</p>

    <!-- TABBLADEN -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px">
      <sc-for list="{{ tabItems }}" as="tab" hint-placeholder-count="6">
        <button onClick="{{ tab.onClick }}" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid {{ tab.border }};background:{{ tab.bg }};color:{{ tab.fg }};transition:background .12s,color .12s">
          <span style="width:9px;height:9px;border-radius:50%;flex:none;background:{{ tab.dot }}"></span>{{ tab.name }}
        </button>
      </sc-for>
    </div>

    <!-- ROOSTER MET APPLETS -->
    <div>
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:18px">
        <span style="width:13px;height:13px;border-radius:50%;flex:none;background:{{ topicColor }}"></span>
        <h2 style="font-size:19px;font-weight:600;margin:0">{{ topicName }}</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px">
        <sc-for list="{{ appletItems }}" as="app" hint-placeholder-count="4">
          <a href="{{ app.href }}" style="text-decoration:none;color:inherit;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:128px;padding:18px;border-radius:14px;border:1px solid {{ app.border }};background:#fffdf9;cursor:{{ app.cursor }};opacity:{{ app.opacity }};box-shadow:0 1px 3px rgba(0,0,0,.05)">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="font-size:16px;font-weight:600;line-height:1.25">{{ app.name }}</span>
            </div>
            <span style="font-size:13px;color:#6f685c;line-height:1.45">{{ app.desc }}</span>
          </a>
        </sc-for>
      </div>
    </div>

    <!-- DOCUMENTEN -->
    <div style="margin-top:40px;padding-top:26px;border-top:1px solid #e0dacd">
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:16px">
        <span style="width:13px;height:13px;border-radius:50%;flex:none;background:oklch(0.64 0.13 75)"></span>
        <h2 style="font-size:19px;font-weight:600;margin:0">Documenten</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:560px">
        <a href="Practicumtemplate6BCW.docx" download style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;border:1px solid #e7e1d5;background:#fffdf9;box-shadow:0 1px 3px rgba(0,0,0,.05)">
          <span style="flex:none;width:38px;height:46px;border-radius:5px;background:#2b579a;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em">DOCX</span>
          <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
            <span style="font-size:15px;font-weight:600">Practicumtemplate6BCW.docx</span>
            <span style="font-size:12.5px;color:#8c8576">Sjabloon voor het practicumverslag</span>
          </span>
          <span style="flex:none;font-size:20px;color:#9a927f;line-height:1">&#8595;</span>
        </a>
        <a href="Voorbeeldgrafiek.xlsx" download style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;border:1px solid #e7e1d5;background:#fffdf9;box-shadow:0 1px 3px rgba(0,0,0,.05)">
          <span style="flex:none;width:38px;height:46px;border-radius:5px;background:#1d6f42;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em">XLSX</span>
          <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
            <span style="font-size:15px;font-weight:600">Voorbeeldgrafiek.xlsx</span>
            <span style="font-size:12.5px;color:#8c8576">Voorbeeld van een grafiek in een rekenblad</span>
          </span>
          <span style="flex:none;font-size:20px;color:#9a927f;line-height:1">&#8595;</span>
        </a>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:760}}">
class Component extends DCLogic {
  topics = [
    { id: 'elektriciteit', name: 'Elektriciteit', color: 'oklch(0.64 0.13 75)', applets: [
      { id: 'stroomkring', name: 'Basis schakeling', desc: 'Batterij, schakelaar en lampen in serie of parallel.', ready: true },
      { id: 'ohm', name: 'Wet van Ohm', desc: 'Onderzoek het verband tussen spanning, stroom en weerstand.', ready: true },
      { id: 'weerstanddraad', name: 'Weerstand van een draad', desc: 'Variëer lengte, doorsnede en materiaal van een draad.', ready: true },
      { id: 'ladingenvelden', name: 'Ladingen en velden', desc: 'Plaats ladingen, bekijk het elektrische veld en de wet van Coulomb.', ready: true },
      { id: 'millikan', name: 'Millikan — oliedruppel', desc: 'Balanceer een druppel en ontdek dat lading gekwantiseerd is.', ready: true },
      { id: 'condensator', name: 'Vlakke condensator', desc: 'Varieer plaatafstand, oppervlak en diëlektricum en meet de capaciteit.', ready: true },
    ]},
    { id: 'elektromagnetisme', name: 'Elektromagnetisme', color: 'oklch(0.64 0.13 150)', applets: [
      { id: 'electromotor', name: 'Gelijkstroommotor', desc: 'Een spoel draait in een magneetveld; de commutator keert de stroom om.', ready: true },
      { id: 'lorentzkracht', name: 'Lorentzkracht', desc: 'Een stroomdraad zwaait uit het veld van een hoefijzermagneet (F = B·I·L).', ready: true },
      { id: 'magneetvelddraad', name: 'Magneetveld rond een draad', desc: 'Concentrische veldlijnen rond een stroomdraad, gepeild met een kompas.', ready: true },
      { id: 'cyclotron', name: 'Cyclotron', desc: 'Geladen deeltjes spiraleren naar buiten, versneld door een wisselspanning in de spleet.', ready: true },
    ]},
    { id: 'kernfysica', name: 'Kernfysica', color: 'oklch(0.64 0.13 28)', applets: [
      { id: 'reactor', name: 'Kernsplijtingsreactor', desc: 'Regel de regelstaven van een gasgekoelde reactor en monitor de splijtingen.', ready: true },
      { id: 'nuclidenkaart', name: 'Nuclidenkaart', desc: 'Verken alle isotopen op de kaart van Z tegen N en hun vervalmodus.', ready: true },
      { id: 'geigermarsden', name: 'Proef van Geiger en Marsden', desc: 'Beschiet een goudfolie met alfadeeltjes en ontdek de atoomkern.', ready: true },
    ]},
    { id: 'mechanica', name: 'Mechanica', color: 'oklch(0.64 0.13 255)', applets: [
      { id: 'rivieroversteek', name: 'Boot steekt rivier over', desc: 'Relatieve snelheid: tel de vaarsnelheid en de stroming vectorieel op.', ready: true },
      { id: 'wrijvinghelling', name: 'Wrijving op een hellend vlak', desc: 'Een blok op een helling; varieer de hoek en de wrijving en zie wanneer het begint te glijden.', ready: true },
      { id: 'grafiekmatching', name: 'Bewegingen en hun grafieken', desc: 'ERB, EVRB, vrije val, verticale, horizontale en schuine worp met x(t), v(t) en a(t); rico en georiënteerde oppervlakte aflezen.', ready: true },
      { id: 'cirkelbeweging', name: 'Eenparige cirkelbeweging', desc: 'Snelheid, centripetale versnelling en kracht; de projectie is een harmonische trilling.', ready: true },
    ]},
    { id: 'golven', name: 'Trillingen & golven', color: 'oklch(0.64 0.13 195)', applets: [
      { id: 'foto', name: 'Foto-elektrisch effect', desc: 'Schijn licht op een metaal en maak elektronen los.', ready: true },
      { id: 'zwartestraler', name: 'Zwarte straler — spectrum', desc: 'Verschuif het stralingsspectrum met de temperatuur (Planck & Wien).', ready: true },
      { id: 'polarisatie', name: 'Polarisatie van licht', desc: 'Onderzoek de wet van Malus met instelbare polarisatoren.', ready: true },
      { id: 'snaar', name: 'Golven op een snaar', desc: 'Wek lopende en staande golven op in een snaar.', ready: true },
      { id: 'staandegolf', name: 'Staande golf door reflectie', desc: 'Heen- en teruglopende golf vormen samen een staande golf.', ready: true },
      { id: 'interferentie', name: 'Interferentie van twee golven', desc: 'Twee coherente bronnen; rode versterkings- en blauwe uitdovingslijnen.', ready: true },
      { id: 'doppler', name: 'Dopplereffect', desc: 'Een bewegende bron; golffronten kruipen vooraan op elkaar en vormen bij v ≥ c een schokgolf.', ready: true },
      { id: 'lissajous', name: 'Lissajous-figuren', desc: 'Stel twee loodrechte trillingen samen; varieer amplitudes, frequenties en faseverschil.', ready: true },
      { id: 'luchtkolom', name: 'Staande golf in een kolom', desc: 'Resonantie in een lucht- of snaarkolom: knopen, buiken en de reeks boventonen.', ready: true },
      { id: 'slinger', name: 'De slinger', desc: 'Meet de slingertijd met een chronometer en bepaal g uit T² tegen L.', ready: true },
    ]},
  ];

  state = { topic: 'golven' };
  hrefs = {
    foto: 'foto.dc.html',
    polarisatie: 'polarisatie.dc.html',
    snaar: 'snaar.dc.html',
    staandegolf: 'staandegolf.dc.html',
    weerstanddraad: 'weerstanddraad.dc.html',
    ladingenvelden: 'ladingenvelden.dc.html',
    stroomkring: 'basisschakeling.dc.html',
    ohm: 'ohm.dc.html',
    millikan: 'millikan.dc.html',
    electromotor: 'electromotor.dc.html',
    lorentzkracht: 'lorentzkracht.dc.html',
    magneetvelddraad: 'magneetvelddraad.dc.html',
    zwartestraler: 'zwartestraler.dc.html',
    reactor: 'kernreactor.dc.html',
    nuclidenkaart: 'nuclidenkaart.dc.html',
    geigermarsden: 'geigermarsden.dc.html',
    interferentie: 'interferentie.dc.html',
    rivieroversteek: 'rivieroversteek.dc.html',
    doppler: 'dopplereffect.dc.html',
    wrijvinghelling: 'wrijvinghelling.dc.html',
    lissajous: 'lissajous.dc.html',
    luchtkolom: 'luchtkolom.dc.html',
    condensator: 'condensator.dc.html',
    cyclotron: 'cyclotron.dc.html',
    grafiekmatching: 'grafiekmatching.dc.html',
    cirkelbeweging: 'cirkelbeweging.dc.html',
    slinger: 'slinger.dc.html',
  };

  componentDidMount() {
    try {
      const t = localStorage.getItem('nat_topic');
      if (t && this.topics.some(x => x.id === t)) this.setState({ topic: t });
    } catch (e) {}
  }

  persist() {
    try { localStorage.setItem('nat_topic', this.state.topic); } catch (e) {}
  }

  selectTopic(id) { this.setState({ topic: id }, () => this.persist()); }

  renderVals() {
    const topic = this.topics.find(t => t.id === this.state.topic) || this.topics[0];
    const tabItems = this.topics.map(t => {
      const active = t.id === topic.id;
      return {
        id: t.id, name: t.name,
        dot: active ? '#ffffff' : t.color,
        bg: active ? t.color : '#fffdf9',
        fg: active ? '#ffffff' : '#6f685c',
        border: active ? t.color : '#e7e1d5',
        onClick: () => this.selectTopic(t.id),
      };
    });
    const appletItems = topic.applets.map(a => ({
      id: a.id, name: a.name, desc: a.desc,
      href: a.ready ? this.hrefs[a.id] : undefined,
      border: a.ready ? topic.color : '#ece7dc',
      cursor: a.ready ? 'pointer' : 'default',
      opacity: a.ready ? '1' : '0.62',
      badgeText: a.ready ? 'Beschikbaar' : 'Binnenkort',
      badgeBg: a.ready ? topic.color : '#efe9dd',
      badgeFg: a.ready ? '#ffffff' : '#9a927f',
    }));
    const readyCount = topic.applets.filter(a => a.ready).length;
    return {
      tabItems,
      appletItems,
      topicName: topic.name,
      topicColor: topic.color,
      appletCountStr: topic.applets.length + ' applets · ' + readyCount + ' beschikbaar',
    };
  }
}
</script>
</body>
</html>
