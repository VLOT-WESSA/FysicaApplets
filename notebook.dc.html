<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="icon" type="image/png" href="icon-zwartestraler.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#eceae4}
  button{font-family:inherit;white-space:nowrap}
  a{color:#6f685c}
  a:hover{color:#2a2723}
  textarea:focus,input:focus{outline:none}
  .md{font-size:15px;line-height:1.6;color:#2a2723}
  .md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
  .md h1{font-size:24px;margin:.6em 0 .4em}.md h2{font-size:20px;margin:.8em 0 .4em}.md h3{font-size:17px;margin:.8em 0 .3em}.md h4{font-size:15px;margin:.8em 0 .3em}
  .md p{margin:.6em 0}.md ul,.md ol{margin:.5em 0;padding-left:1.5em}
  .md code{font-family:'IBM Plex Mono',monospace;font-size:13px;background:#f1ede3;padding:1px 5px;border-radius:4px}
  .md pre{background:#f6f2e9;border:1px solid #e7e1d5;border-radius:8px;padding:10px 12px;overflow:auto;margin:.6em 0}
  .md pre code{background:none;padding:0}
  .md blockquote{margin:.6em 0;padding:2px 14px;background:#f6f2e9;border-radius:8px;color:#4a453d}
  .md hr{border:0;border-top:1px solid #e7e1d5;margin:1em 0}
  .md a{color:oklch(0.5 0.13 300)}
  .md .alert{padding:12px 16px;margin:.6em 0;border:1px solid transparent;border-radius:10px}
  .md .alert>*:first-child{margin-top:0}.md .alert>*:last-child{margin-bottom:0}
  .md .alert-info,.md .alert-success{background:#e6f0f7;border-color:#c9dde9;color:#1f4b63}
  .md .alert-success{background:#e8f3e8;border-color:#cde3cd;color:#2c5a2c}
  .md .alert-warning{background:#f9f1de;border-color:#ecdcb2;color:#6b531d}
  .md .alert-danger{background:#f8e6e4;border-color:#ebc6c2;color:#7d2c27}
  .md font{font-size:inherit}
  .out table{border-collapse:collapse;font-size:13px;font-family:'IBM Plex Mono',monospace}
  .out th,.out td{border:1px solid #e7e1d5;padding:3px 8px;text-align:right}
  .out th{background:#f6f2e9}
  .out img{max-width:100%;height:auto;display:block;background:#fff}
  @media print{
    @page{margin:14mm}
    html,body{height:auto !important;background:#fff !important}
    .applet-root{height:auto !important;overflow:visible !important;padding:0 !important;background:#fff !important;display:block !important}
    .nb-scroll{overflow:visible !important}
    .np{display:none !important}
    .nb-scroll *{box-shadow:none !important}
    .nb-scroll>div>div,.out img{break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (max-width:760px){
    html,body{height:auto}
    .applet-root{height:auto !important;min-height:100vh;overflow:visible !important;padding:12px 14px 22px !important}
    .nb-scroll{overflow:visible !important}
  }
</style>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(a){var h=a.getAttribute('href');if(h==='index.html'||h==='./index.html'){e.preventDefault();e.stopImmediatePropagation();window.location.href='index.html';}}},true);</script>
</helmet>
<div class="applet-root" style="font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;color:#2a2723;background:#eceae4;height:100vh;display:flex;flex-direction:column;padding:16px 22px 18px;overflow:hidden">
  <div style="display:flex;align-items:center;gap:14px;flex:none;margin-bottom:12px;flex-wrap:wrap">
    <a class="np" href="index.html" style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:#6f685c;text-decoration:none">&larr; Alle simulaties</a>
    <h1 style="font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em">Python-notebook</h1>
    <div class="np" style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#4a453d">
      <span style="{{ dotStyle }}"></span>
      <span style="font-family:'IBM Plex Mono',monospace">{{ statusText }}</span>
    </div>
  </div>
  <input ref="{{ dataRef }}" type="file" multiple onChange="{{ onData }}" style="display:none">
  <input ref="{{ fileRef }}" type="file" accept=".ipynb,application/json" onChange="{{ onFile }}" style="display:none">
  <sc-if value="{{ hasNb }}" hint-placeholder-val="{{ false }}">
    <div class="np" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;margin-bottom:12px;padding:8px 10px;background:#fffdf9;border:1px solid #e7e1d5;border-radius:12px">
      <button onClick="{{ goStart }}" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Start</button>
      <input value="{{ nbName }}" onInput="{{ onName }}" spellcheck="false" style="width:210px;min-height:34px;padding:0 10px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#2a2723">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6f685c">.ipynb</span>
      <button onClick="{{ onSave }}" style="min-height:34px;padding:0 14px;border:1px solid oklch(0.5 0.13 300);border-radius:8px;background:oklch(0.5 0.13 300);color:#fff;cursor:pointer;font-size:13px;font-weight:600">Opslaan</button>
      <div style="width:1px;height:24px;background:#e7e1d5;margin:0 4px"></div>
      <button onClick="{{ pickData }}" title="Voeg een .csv-, .txt- of .json-bestand toe voor je code" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Bestand toevoegen</button>
      <button onClick="{{ runAll }}" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Alles uitvoeren</button>
      <button onClick="{{ restart }}" title="Wist alle variabelen en de uitvoernummers" style="min-height:34px;padding:0 12px;border:1px solid oklch(0.5 0.13 28);border-radius:8px;background:#fff;color:oklch(0.45 0.13 28);cursor:pointer;font-size:13px;font-weight:600">Kernel herstarten</button>
      <button onClick="{{ restartRun }}" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Herstarten en alles uitvoeren</button>
      <button onClick="{{ clearOut }}" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Uitvoer wissen</button>
      <button onClick="{{ exportPdf }}" title="Opent het afdrukvenster: kies daar ‘Opslaan als pdf’" style="min-height:34px;padding:0 12px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500">Exporteer als pdf</button>
      <div style="margin-left:auto;display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;color:#4a453d">
        <span style="white-space:nowrap">Ctrl+Enter: uitvoeren · Shift+Enter: uitvoeren en volgende cel</span>
        <span style="white-space:nowrap;color:#6f685c">{{ saveInfo }}</span>
      </div>
    </div>
  </sc-if>
  <div class="nb-scroll" onDragOver="{{ onDragOver }}" onDrop="{{ onDrop }}" style="flex:1;min-height:0;overflow:auto">
    <sc-if value="{{ showStart }}" hint-placeholder-val="{{ true }}">
      <div style="max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
          <button onClick="{{ newNb }}" style="text-align:left;padding:18px 20px;background:#fffdf9;border:1px solid #e7e1d5;border-radius:14px;cursor:pointer;font-family:inherit;color:#2a2723">
            <div style="font-size:16px;font-weight:600;margin-bottom:6px">Lege notebook</div>
            <div style="font-size:14px;color:#4a453d;line-height:1.5">Begin met één lege codecel.</div>
          </button>
          <button onClick="{{ openFile }}" style="{{ dropStyle }}">
            <div style="font-size:16px;font-weight:600;margin-bottom:6px">Bestand openen</div>
            <div style="font-size:14px;color:#4a453d;line-height:1.5">Kies een .ipynb-bestand of sleep het hierheen.</div>
          </button>
        </div>
        <div>
          <h2 style="font-size:16px;font-weight:600;margin:0 0 10px">Opgaven</h2>
          <sc-if value="{{ opgLoading }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:14px;color:#4a453d">Opgaven worden opgehaald…</div>
          </sc-if>
          <sc-if value="{{ opgMsg }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:14px;color:#4a453d;line-height:1.5;max-width:640px">{{ opgMsgText }}</div>
          </sc-if>
          <div style="display:flex;flex-direction:column;gap:18px">
            <sc-for list="{{ groepen }}" as="g" hint-placeholder-count="0">
              <div>
                <h3 style="font-size:14px;font-weight:600;margin:0 0 8px;color:oklch(0.5 0.13 300)">{{ g.titel }}</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
                  <sc-for list="{{ g.items }}" as="o" hint-placeholder-count="0">
                    <button onClick="{{ o.onClick }}" style="text-align:left;padding:14px 16px;background:#fffdf9;border:1px solid #e7e1d5;border-radius:12px;cursor:pointer;font-family:inherit;color:#2a2723;font-size:14px;font-weight:500">{{ o.label }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ hasNb }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:0;padding-bottom:40px">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="0">
          <div style="display:flex;flex-direction:column;gap:0">
            <div style="display:flex;gap:10px;align-items:flex-start">
              <div style="width:46px;flex:none;display:flex;justify-content:flex-end;padding-top:{{ c.gutterPad }}px">
                <div style="{{ c.counterStyle }}">{{ c.counter }}</div>
              </div>
              <div onMouseEnter="{{ c.onEnter }}" onMouseLeave="{{ c.onLeave }}" style="{{ c.cardStyle }}">
                <sc-if value="{{ c.showTools }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;top:6px;right:6px;display:flex;gap:4px;background:rgba(255,253,249,.96);padding:3px;border:1px solid #e7e1d5;border-radius:10px;z-index:2">
                    <button onClick="{{ c.onToggleEdit }}" style="min-height:32px;padding:0 10px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">Bewerk</button>
                    <button onClick="{{ c.onType }}" style="min-height:32px;padding:0 10px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">Naar code</button>
                    <button onClick="{{ c.onUp }}" title="Omhoog" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:15px;opacity:{{ c.upOpacity }}">&uarr;</button>
                    <button onClick="{{ c.onDown }}" title="Omlaag" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:15px;opacity:{{ c.downOpacity }}">&darr;</button>
                    <button onClick="{{ c.onDelete }}" title="Cel verwijderen" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;color:oklch(0.5 0.13 28)">&times;</button>
                  </div>
                </sc-if>
                <sc-if value="{{ c.showHeader }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-bottom:1px solid #efe9dd;background:#faf7f0;border-radius:11px 11px 0 0">
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:#4a453d">{{ c.kind }}</span>
                  <div style="margin-left:auto;display:flex;gap:4px">
                    <sc-if value="{{ c.isMd }}" hint-placeholder-val="{{ false }}">
                      <button onClick="{{ c.onToggleEdit }}" style="min-height:32px;padding:0 10px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">{{ c.editLabel }}</button>
                    </sc-if>
                    <button onClick="{{ c.onType }}" title="Celtype wisselen" style="min-height:32px;padding:0 10px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">{{ c.typeLabel }}</button>
                    <button onClick="{{ c.onUp }}" title="Omhoog" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:15px;opacity:{{ c.upOpacity }}">&uarr;</button>
                    <button onClick="{{ c.onDown }}" title="Omlaag" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:15px;opacity:{{ c.downOpacity }}">&darr;</button>
                    <button onClick="{{ c.onDelete }}" title="Cel verwijderen" style="width:32px;min-height:32px;border:1px solid #e7e1d5;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;color:oklch(0.5 0.13 28)">&times;</button>
                  </div>
                </div>
                </sc-if>
                <sc-if value="{{ c.showEditor }}" hint-placeholder-val="{{ false }}">
                  <div style="position:relative">
                    <pre ref="{{ c.preRef }}" style="{{ c.preStyle }}"></pre>
                    <textarea data-cid="{{ c.id }}" value="{{ c.source }}" onInput="{{ c.onInput }}" onKeyDown="{{ c.onKey }}" onFocus="{{ c.onFocus }}" spellcheck="false" autocomplete="off" autocapitalize="off" style="{{ c.taStyle }}"></textarea>
                  </div>
                </sc-if>
                <sc-if value="{{ c.showMd }}" hint-placeholder-val="{{ false }}">
                  <div class="md" ref="{{ c.mdRef }}" onDoubleClick="{{ c.onToggleEdit }}" style="padding:6px 16px"></div>
                </sc-if>
                <sc-if value="{{ c.hasOut }}" hint-placeholder-val="{{ false }}">
                  <div class="out" ref="{{ c.outRef }}" style="padding:10px 14px;border-top:1px solid #efe9dd;overflow:auto;max-height:560px"></div>
                </sc-if>
              </div>
            </div>
            <div onMouseEnter="{{ c.onGapIn }}" onMouseLeave="{{ c.onGapOut }}" style="position:relative;height:14px">
              <sc-if value="{{ c.showAdd }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;left:0;right:0;top:-6px;display:flex;gap:8px;justify-content:center;z-index:3">
                  <button onClick="{{ c.onAddCode }}" style="min-height:26px;padding:0 12px;border:1px solid #cfc8b8;border-radius:8px;background:#fffdf9;cursor:pointer;font-size:12px;color:#2a2723">+ Code</button>
                  <button onClick="{{ c.onAddText }}" style="min-height:26px;padding:0 12px;border:1px solid #cfc8b8;border-radius:8px;background:#fffdf9;cursor:pointer;font-size:12px;color:#2a2723">+ Tekst</button>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PY_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const OPG_DIR = 'notebooks/';
const LS_KEY = 'nb_session_v1';

const PY_HELPER = `
import ast, sys, json, base64, io, traceback, warnings
warnings.filterwarnings('ignore', message='.*currently using agg.*')
warnings.filterwarnings('ignore', category=DeprecationWarning)
_ns = {'__name__': '__main__'}
def _reset():
    _ns.clear()
    _ns['__name__'] = '__main__'
def _figs():
    out = []
    if 'matplotlib.pyplot' not in sys.modules:
        return out
    import matplotlib.pyplot as plt
    for n in plt.get_fignums():
        f = plt.figure(n)
        b = io.BytesIO()
        f.savefig(b, format='png', dpi=200, bbox_inches='tight', facecolor='white')
        raw = b.getvalue()
        out.append([base64.b64encode(raw).decode(), int.from_bytes(raw[16:20], 'big'), int.from_bytes(raw[20:24], 'big')])
    plt.close('all')
    return out
def _run_safe(code):
    res = {'repr': None, 'figs': [], 'err': None}
    try:
        tree = ast.parse(code, '<cel>', 'exec')
        last = None
        if tree.body and isinstance(tree.body[-1], ast.Expr):
            last = ast.Expression(tree.body.pop().value)
        exec(compile(tree, '<cel>', 'exec'), _ns)
        if last is not None:
            v = eval(compile(last, '<cel>', 'eval'), _ns)
            if v is not None:
                _ns['_'] = v
                r = repr(v)
                if not r.startswith('<Figure'):
                    res['repr'] = r
    except BaseException as e:
        tb = sys.exc_info()[2]
        frames = [f for f in traceback.extract_tb(tb) if f.filename == '<cel>']
        lines = []
        if frames:
            lines.append('Traceback (most recent call last):\\n')
            lines += traceback.format_list(frames)
        lines += traceback.format_exception_only(type(e), e)
        res['err'] = {'ename': type(e).__name__, 'evalue': str(e), 'tb': ''.join(lines)}
    try:
        res['figs'] = _figs()
    except BaseException:
        pass
    return json.dumps(res)
`;

class Component extends DCLogic {
  state = { nb: null, py: 'idle', busy: false, focus: null, dirty: false, saved: '', opgaven: [], opgLoading: false, opgMsg: '', dragOver: false, session: null, hov: null, gap: null };
  fileRef = React.createRef(); dataRef = React.createRef();
  _id = 1; _ec = 0; _q = Promise.resolve(); _buf = [];

  componentDidMount() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (s && s.cells && s.cells.length) this.setState({ session: s });
    } catch (e) {}
    this.loadOpgaven();
    setTimeout(() => this.ensurePy().catch(() => {}), 400);
  }
  componentDidUpdate(_, prev) {
    if (this.state.nb !== prev.nb && this.state.nb) {
      clearTimeout(this._sv);
      this._sv = setTimeout(() => this.autosave(), 700);
    }
  }
  componentWillUnmount() { clearTimeout(this._sv); }

  uid() { return 'c' + (this._id++) + Math.random().toString(36).slice(2, 6); }

  autosave() {
    const nb = this.state.nb; if (!nb) return;
    const data = this.toJson(nb);
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); this.setState({ saved: 'Automatisch bewaard' }); }
    catch (e) {
      try {
        data.cells.forEach(c => { if (c.outputs) c.outputs = c.outputs.filter(o => !(o.data && o.data['image/png'])); });
        localStorage.setItem(LS_KEY, JSON.stringify(data)); this.setState({ saved: 'Automatisch bewaard (zonder grafieken)' });
      } catch (e2) { this.setState({ saved: 'Automatisch bewaren mislukt: download het bestand' }); }
    }
  }

  async loadOpgaven() {
    this.setState({ opgLoading: true });
    const base = new URL(OPG_DIR, location.href);
    let list = null;
    const tryIndex = async () => {
      const r = await fetch(new URL('index.json', base), { cache: 'no-cache' });
      if (!r.ok) return null;
      return (await r.json()).map(f => typeof f === 'string' ? { file: f } : f);
    };
    const tryGithub = async () => {
      const m = location.hostname.match(/^([^.]+)\.github\.io$/);
      if (!m) return null;
      const repo = location.pathname.split('/').filter(Boolean)[0];
      const dir = base.pathname.split('/').filter(Boolean).slice(repo ? 1 : 0).join('/');
      const key = 'nb_opg_' + m[1] + '/' + repo + '/' + dir;
      try {
        const r = await fetch('https://api.github.com/repos/' + m[1] + '/' + (repo || m[1] + '.github.io') + '/contents/' + dir);
        if (!r.ok) throw new Error(r.status);
        const l = (await r.json()).filter(f => /\.ipynb$/i.test(f.name)).map(f => ({ file: f.name }));
        try { localStorage.setItem(key, JSON.stringify(l)); } catch (e) {}
        return l;
      } catch (e) {
        try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e2) { return null; }
      }
    };
    const tryDir = async () => {
      const r = await fetch(base, { cache: 'no-cache' });
      const t = await r.text();
      return Array.from(t.matchAll(/href="([^"?#]+\.ipynb)"/gi)).map(m => ({ file: decodeURIComponent(m[1]).split('/').pop() }));
    };
    for (const f of [tryIndex, tryGithub, tryDir]) {
      try { const l = await f(); if (l && l.length) { list = l; break; } } catch (e) {}
    }
    list = (list || []).filter(o => o.file).sort((x, y) => x.file.localeCompare(y.file, 'nl', { numeric: true }))
      .map(o => ({ file: o.file.replace(/\.ipynb$/i, ''), groep: o.groep || (/^6de[_ -]/i.test(o.file) ? '6de jaar' : '5de jaar'), name: o.titel || o.file.replace(/\.ipynb$/i, '').replace(/^6de[_ -]+/i, '').replace(/_+/g, ' ').trim(), url: new URL(encodeURIComponent(o.file), base).href }));
    this.setState({ opgaven: list, opgLoading: false, opgMsg: list.length ? '' : 'Geen opgaven gevonden in de map notebooks.' });
  }

  async loadFiles(py, src) {
    const seen = this._files || (this._files = new Set());
    const names = new Set(Array.from(src.matchAll(/["']([\w\-. ]+\.(?:csv|txt|json|tsv|dat))["']/gi)).map(m => m[1]));
    for (const n of names) {
      if (seen.has(n)) continue;
      let ok = false;

  /* ---------- Python ---------- */
  ensurePy() {

          py.setStdout({ batched: s => this._buf.push(['stdout', s]) });
          py.setStderr({ batched: s => this._buf.push(['stderr', s]) });

  runCell(id, advance) {

  /* ---------- weergave ---------- */
  esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      const p = []; while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(L[i]) && !/^\s*<\/?(div|ul|ol|table|h[1-6]|pre|details|blockquote|section)\b/i.test(L[i])) p.push(L[i++]);

  }
  clean(h) {

    t.content.querySelectorAll('script,iframe,object,embed,link,style').forEach(n => n.remove());
    t.content.querySelectorAll('*').forEach(n => Array.from(n.attributes).forEach(a => { if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
    return t.innerHTML;
  }
  outHtml(outs) {
    const j = x => Array.isArray(x) ? x.join('') : (x || '');
    const ansi = t => String(t).replace(/\x1b\[[0-9;]*[A-Za-z]/g, '');
    const pre = (t, col, bg) => '<pre style="margin:0 0 6px;white-space:pre-wrap;word-break:break-word;font-family:\'JetBrains Mono\',\'IBM Plex Mono\',monospace;font-size:13.5px;line-height:1.5;color:' + col + (bg ? ';background:' + bg + ';padding:8px 10px;border-radius:8px' : '') + '">' + this.esc(ansi(t)) + '</pre>';

    const KW = new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None'.split(' '));

      onDragOver: e => { e.preventDefault(); if (!st.dragOver) this.setState({ dragOver: true }); },
      onDrop: e => { e.preventDefault(); this.setState({ dragOver: false }); const f = e.dataTransfer.files[0]; if (f && this.confirmLeave()) this.readFile(f); },
      dropStyle: 'text-align:left;padding:18px 20px;background:' + (st.dragOver ? '#f3eefa' : '#fffdf9') + ';border:1px ' + (st.dragOver ? 'solid oklch(0.64 0.13 300)' : 'dashed #cfc8b8') + ';border-radius:14px;cursor:pointer;font-family:inherit;color:#2a2723',
      newNb: () => { this.openNb({ cells: [] }, 'naamloos'); this.focusCell(this.state.nb && this.state.nb.cells[0].id); setTimeout(() => { const c = this.state.nb.cells[0]; this.focusCell(c.id); }, 60); },
      goStart: () => { if (this.confirmLeave()) { this.autosave(); this.setState({ nb: null, dirty: false, session: (() => { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } })() }); } },
      hasSession: !!sess, sessionName: sess ? (sess.name || 'naamloos') : '', sessionInfo: sess ? sess.cells.length + ' cellen' : '',
      resume: () => { this.openNb(sess, sess.name); },
      groepen: ['5de jaar', '6de jaar'].concat(Array.from(new Set(st.opgaven.map(o => o.groep))).filter(g => g !== '5de jaar' && g !== '6de jaar')).map(g => ({ titel: g, items: st.opgaven.filter(o => o.groep === g).map(o => ({ label: o.name, onClick: () => this.openUrl(o) })) })).filter(g => g.items.length),
      opgLoading: st.opgLoading, opgMsg: !!st.opgMsg, opgMsgText: st.opgMsg,
      runAll: () => { if (this.state.nb) this.state.nb.cells.forEach(c => this.runCell(c.id, false)); },
      restart: () => {
        this._ec = 0;
        this._py && this._py.then(py => py.globals.get('_reset')()).catch(() => {});
        this.setNb(nb => ({ ...nb, cells: nb.cells.map(c => ({ ...c, count: null })) }));
        this.setState({ saved: 'Kernel herstart: variabelen gewist' });
      },
      restartRun: () => {
        this._ec = 0;
        this._q = this._q.then(() => this._py ? this._py.then(py => py.globals.get('_reset')()).catch(() => {}) : null);
        this.setNb(nb => ({ ...nb, cells: nb.cells.map(c => ({ ...c, count: null, outputs: [] })) }));
        this.state.nb.cells.forEach(c => this.runCell(c.id, false));
      },
      exportPdf: () => { const t = document.title; document.title = (nb ? nb.name : 'notebook') || 'notebook'; window.print(); setTimeout(() => { document.title = t; }, 500); },
      clearOut: () => this.setNb(nb => ({ ...nb, cells: nb.cells.map(c => ({ ...c, outputs: [], count: null })) }))
    };
  }
}
</script>
</body>
